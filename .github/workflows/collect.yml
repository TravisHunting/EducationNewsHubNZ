name: Trigger Site education collection
on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: education-collection
  cancel-in-progress: false
jobs:
  collect:
    # Evaluated before a runner is allocated. Private repos and forks fail closed.
    if: github.repository == 'TravisHunting/EducationNewsHubNZ' && github.event.repository.private == false && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      # Only authenticated triggers. No publisher scraping or snapshot writes in GitHub.
      - name: Trigger Site backend collection
        run: node scripts/scheduled-collect.mjs

